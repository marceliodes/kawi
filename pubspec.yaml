name: kawi
description: >-
  Fast, lightweight, distraction-free cross-platform document reader
  with real-time, offline streaming Text-to-Speech.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  audioplayers: ^6.8.1
  crypto: ^3.0.7
  desktop_drop: ^0.8.4
  drift: ^2.35.0
  ffi: ^2.2.0
  file_picker: ^13.1.0
  file_picker_linux: ^2.0.0
  flutter:
    sdk: flutter
  flutter_kokoro_tts: ^0.0.1
  flutter_riverpod: ^3.4.3
  http: ^1.6.0
  path: ^1.9.1
  path_provider: ^2.1.6
  phosphoricons_flutter: ^1.0.0
  piper_tts: ^0.0.1
  scrollable_positioned_list: ^0.3.8
  sqlite3_flutter_libs: ^0.6.0+eol

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  path_provider_platform_interface: ^2.1.2

flutter:
  uses-material-design: true

  fonts:
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-Regular.ttf
        - asset: assets/fonts/Literata-Italic.ttf
          style: italic
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700
